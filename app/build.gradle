plugins {
    id 'com.android.application'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.kapt'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' version '2.1.20-2.0.0'
}

android {
    namespace 'com.tsic'
    compileSdk 36

    defaultConfig {
        applicationId "com.tsic"
        minSdk 23
        targetSdk 36
        versionCode 75
        versionName "5.8.7"
        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        dataBinding true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    packagingOptions {
        jniLibs {
            pickFirsts += [
                    'lib/x86/libc++_shared.so',
                    'lib/x86_64/libc++_shared.so',
                    'lib/armeabi-v7a/libc++_shared.so',
                    'lib/arm64-v8a/libc++_shared.so'
            ]
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"

    // AndroidX + Material
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Retrofit + OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // RxJava
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    // Anko (Deprecated but kept for compatibility)
    implementation "org.jetbrains.anko:anko-appcompat-v7-commons:0.10.8"
    implementation "org.jetbrains.anko:anko-commons:0.10.8"
    implementation "org.jetbrains.anko:anko-support-v4-commons:0.10.8"
    implementation "org.jetbrains.anko:anko-design:0.10.8"
    implementation "org.jetbrains.anko:anko-appcompat-v7:0.10.8"
    implementation "org.jetbrains.anko:anko-sdk25:0.10.8"

    // Sockets
    implementation('io.socket:socket.io-client:1.0.0') {
        exclude group: 'org.json', module: 'json'
    }

    // Firebase
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
    implementation 'com.google.firebase:firebase-crashlytics-ktx:19.4.2'
    implementation 'com.google.android.libraries.places:places:4.2.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    ksp 'com.github.bumptech.glide:ksp:4.16.0'

    // Image Pickers
    implementation 'com.github.esafirm:android-image-picker:3.0.0'
    implementation 'io.github.ParkSangGwon:tedimagepicker:1.6.1'

    // Permissions
    implementation 'com.karumi:dexter:6.2.1'

    // ExoPlayer
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-dash:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'

    // File Downloader
    implementation 'com.mindorks.android:prdownloader:0.5.0'

    // Zoom SDK
    implementation 'us.zoom.videosdk:zoomvideosdk-core:1.13.10'
    implementation 'us.zoom.videosdk:zoomvideosdk-annotation:1.13.10'
    implementation 'us.zoom.videosdk:zoomvideosdk-videoeffects:1.13.10'

    // Twilio
    implementation 'com.twilio:chat-android:7.0.0'

    // Volley
    implementation 'com.android.volley:volley:1.2.1'

    // UI Utils
    implementation 'com.marlonmafra.android.widget:edittext-password:1.0.0'
    implementation 'com.github.kizitonwose:CalendarView:1.0.3'
    implementation "com.intuit.sdp:sdp-android:1.1.0"
    implementation "com.intuit.ssp:ssp-android:1.1.0"

    // UI Effects
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
}